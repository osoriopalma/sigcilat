<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(content=~{::content}, pageTitle='Usuarios (Admin)')}">


    <body>
        <div th:fragment="content">
            <h2>Usuarios</h2>

            <p>
                <a th:href="@{/admin/usuarios/nuevo}">+ Nuevo usuario</a> |
                <a th:href="@{/ciudadanos}">Ciudadanos</a>
            </p>

            <table border="1" cellpadding="8" cellspacing="0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Enabled</th>
                        <th>Roles</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.enabled}"></td>

                        <td>
                            <span th:text="${u.roles == null ? '' : #strings.listJoin(u.roles.![nombre], ', ')}"></span>
                        </td>

                        <td>
                            <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}">Editar</a>

                            <form th:action="@{/admin/usuarios/{id}/toggle(id=${u.id})}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" th:text="${u.enabled ? 'Deshabilitar' : 'Habilitar'}"></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
