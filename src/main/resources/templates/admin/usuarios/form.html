<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(content=~{::content}, pageTitle='Usuarios (Admin)')}">

    <body>
        <div th:fragment="content">
            <h2 th:text="${form.id == null ? 'Nuevo usuario' : 'Editar usuario'}"></h2>

            <form th:action="${form.id == null} ? @{/admin/usuarios/guardar} : @{/admin/usuarios/{id}/actualizar(id=${form.id})}"
                  method="post" th:object="${form}">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Username:</label>
                <input type="text" th:field="*{username}" required>
                <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                <br>

                <label>Password:</label>
                <input type="password" th:field="*{password}" th:placeholder="${form.id != null ? '(dejar vacío para no cambiar)' : ''}">
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <br>

                <label>Enabled:</label>
                <input type="checkbox" th:field="*{enabled}">
                <br><br>

                <label>Roles:</label><br>
                <div th:each="r : ${roles}">
                    <label>
                        <input type="checkbox" th:value="${r.id}" th:field="*{roleIds}">
                        <span th:text="${r.nombre}"></span>
                    </label><br>
                </div>
                <div th:if="${#fields.hasErrors('roleIds')}" th:errors="*{roleIds}"></div>

                <br>
                <button type="submit">Guardar</button>
                <a href="/admin/usuarios">Cancelar</a>
            </form>
        </div>
    </body>
</html>
