<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(content=~{::content}, pageTitle='Usuarios (Admin)')}">

    <body>
        <div th:fragment="content">
            <h2>Alta de Ciudadano</h2>

            <form th:action="@{/ciudadanos/guardar}" method="post" th:object="${ciudadano}">

                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" required><br>

                <label>Apellido paterno:</label>
                <input type="text" th:field="*{apellidoPaterno}" required><br>

                <label>Apellido materno:</label>
                <input type="text" th:field="*{apellidoMaterno}" required><br>

                <label>CURP:</label>
                <input type="text" th:field="*{curp}" maxlength="18" required>
                <div th:if="${#fields.hasErrors('curp')}" th:errors="*{curp}"></div>
                <br>

                <label>Fecha de nacimiento:</label>
                <input type="date" th:field="*{fechaNacimiento}" required><br>

                <label>Teléfono:</label>
                <input type="text" th:field="*{telefono}"><br>

                <label>Correo:</label>
                <input type="email" th:field="*{correo}"><br>

                <label>Domicilio:</label>
                <input type="text" th:field="*{domicilio}" required><br>

                <button type="submit">Guardar</button>
            </form>
        </div>
    </body>
</html>
