<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(content=~{::content}, pageTitle='Usuarios (Admin)')}">

    <body>
        <div th:fragment="content">
            <h2>Editar Ciudadano</h2>

            <p>
                <b>Clave:</b>
                <span th:text="*{claveConsecutiva}"></span>
                &nbsp; | &nbsp;
                <b>ID:</b>
                <span th:text="*{id}"></span>
            </p>

            <form th:action="@{/ciudadanos/{id}/actualizar(id=*{id})}"
                  method="post"
                  th:object="${ciudadano}">

                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" required>
                <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                <br>

                <label>Apellido paterno:</label>
                <input type="text" th:field="*{apellidoPaterno}" required>
                <div th:if="${#fields.hasErrors('apellidoPaterno')}" th:errors="*{apellidoPaterno}"></div>
                <br>

                <label>Apellido materno:</label>
                <input type="text" th:field="*{apellidoMaterno}" required>
                <div th:if="${#fields.hasErrors('apellidoMaterno')}" th:errors="*{apellidoMaterno}"></div>
                <br>

                <label>CURP:</label>
                <input type="text" th:field="*{curp}" maxlength="18" required>
                <div th:if="${#fields.hasErrors('curp')}" th:errors="*{curp}"></div>
                <br>

                <label>Fecha de nacimiento:</label>
                <input type="date" th:field="*{fechaNacimiento}" required>
                <div th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                <br>

                <label>Teléfono:</label>
                <input type="text" th:field="*{telefono}">
                <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                <br>

                <label>Correo:</label>
                <input type="email" th:field="*{correo}">
                <div th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                <br>

                <label>Domicilio:</label>
                <input type="text" th:field="*{domicilio}" required>
                <div th:if="${#fields.hasErrors('domicilio')}" th:errors="*{domicilio}"></div>
                <br><br>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">Guardar cambios</button>
                <a th:href="@{/ciudadanos}">Cancelar</a>
            </form>
        </div>
    </body>
</html>
